<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Endless Runner Playable Ad</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #score-board {
            padding: 20px;
            font-size: 30px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* End Screen / CTA */
        #cta-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
        }

        .cta-content {
            text-align: center;
            color: white;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cta-title { font-size: 40px; margin-bottom: 20px; }
        .cta-desc { font-size: 20px; margin-bottom: 40px; opacity: 0.8; }

        .install-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b33939;
            transition: transform 0.1s;
            animation: pulse 2s infinite;
        }
        .install-btn:active { transform: translateY(5px); box-shadow: none; }

        /* Tutorial Hint */
        #tutorial-hint {
            position: absolute;
            bottom: 20%; width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            animation: fadeBlink 1.5s infinite;
            pointer-events: none;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes fadeBlink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="score-board">0</div>
        <div id="tutorial-hint">Tap to Jump!</div>
    </div>

    <div id="cta-screen">
        <div class="cta-content">
            <h1 class="cta-title">Awesome Run!</h1>
            <p class="cta-desc">Can you beat the high score?</p>
            <button class="install-btn" onclick="installApp()">PLAY NOW</button>
        </div>
    </div>

    <script>
        // --- Game Config ---
        const CONFIG = {
            gravity: 1500,
            jumpForce: -700,
            speed: 400,
            spawnRate: 2.0, // seconds
            winScore: 10
        };

        // --- Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-board');
        const ctaScreen = document.getElementById('cta-screen');
        const tutorialHint = document.getElementById('tutorial-hint');

        let width, height;
        let lastTime = 0;
        let isGameOver = false;
        let hasStarted = false;
        let score = 0;
        let spawnTimer = 0;

        // Entities
        const player = {
            x: 50,
            y: 0,
            width: 50,
            height: 50,
            vy: 0,
            grounded: false,
            color: '#2ed573'
        };

        const ground = {
            y: 0,
            height: 100,
            color: '#57606f'
        };

        let obstacles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            ground.y = height - ground.height;
            if (!hasStarted) {
                player.y = ground.y - player.height;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Input ---
        function jump() {
            if (isGameOver) return;

            if (!hasStarted) {
                hasStarted = true;
                tutorialHint.style.display = 'none';
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            if (player.grounded) {
                player.vy = CONFIG.jumpForce;
                player.grounded = false;
            }
        }

        window.addEventListener('mousedown', jump);
        window.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, {passive: false});
        window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });

        // --- Game Loop ---
        function gameLoop(timestamp) {
            if (isGameOver) return;

            const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            // Player Physics
            player.vy += CONFIG.gravity * dt;
            player.y += player.vy * dt;

            // Ground Collision
            if (player.y + player.height >= ground.y) {
                player.y = ground.y - player.height;
                player.vy = 0;
                player.grounded = true;
            }

            // Obstacles Spawning
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnTimer = CONFIG.spawnRate - (Math.random() * 0.5);
                createObstacle();
            }

            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let ob = obstacles[i];
                ob.x -= CONFIG.speed * dt;

                // Score
                if (!ob.passed && ob.x + ob.width < player.x) {
                    ob.passed = true;
                    score++;
                    scoreEl.innerText = score;

                    if (score >= CONFIG.winScore) {
                        endGame(true);
                    }
                }

                // Remove off-screen
                if (ob.x + ob.width < 0) {
                    obstacles.splice(i, 1);
                }

                // Collision
                if (checkCollision(player, ob)) {
                    endGame(false);
                }
            }
        }

        function createObstacle() {
            // Randomize obstacle type (tall or short)
            const isTall = Math.random() > 0.5;
            const h = isTall ? 70 : 40;
            const w = 40;

            obstacles.push({
                x: width,
                y: ground.y - h,
                width: w,
                height: h,
                passed: false,
                color: '#ff6b81'
            });
        }

        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.width &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.height &&
                r1.y + r1.height > r2.y
            );
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#87CEEB'; // Sky blue
            ctx.fillRect(0, 0, width, height);

            // Ground
            ctx.fillStyle = ground.color;
            ctx.fillRect(0, ground.y, width, ground.height);

            // Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Simple eyes for character
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 30, player.y + 10, 10, 10);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 35, player.y + 12, 5, 5);


            // Obstacles
            obstacles.forEach(ob => {
                ctx.fillStyle = ob.color;
                ctx.fillRect(ob.x, ob.y, ob.width, ob.height);
            });
        }

        function endGame(win) {
            isGameOver = true;
            ctaScreen.style.display = 'flex';
            const title = ctaScreen.querySelector('.cta-title');
            const desc = ctaScreen.querySelector('.cta-desc');

            if (win) {
                title.innerText = "You Won!";
                desc.innerText = "Great reflexes!";
            } else {
                title.innerText = "Game Over";
                desc.innerText = "Score: " + score;
            }
        }

        // --- Ad Network Integration ---
        function installApp() {
            // Standard Ad Network calls
            if (window.mraid && window.mraid.open) {
                window.mraid.open("https://apps.apple.com/app/id123456789");
            } else if (window.dapi && window.dapi.openStoreUrl) {
                window.dapi.openStoreUrl();
            } else {
                window.open("https://play.google.com/store/apps", "_blank");
            }
        }

        // Initial render
        draw();

    </script>
</body>
</html>
